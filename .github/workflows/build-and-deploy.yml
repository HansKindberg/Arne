# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: Build & deploy
on:
  pull_request:
  push:
    # branches:
    # - Development
    # - main
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          node-version: "24.16.x"
      - name: Build project
        run: dotnet build Source/Site/Site.csproj -c Release
      - name: Clean wwwroot
        run: |
          find Source/Site/wwwroot -name ".gitkeep" -type f -delete
      - name: Prepare publish folder
        run: |
          mkdir -p publish
          cp -r Source/Site/wwwroot/* publish/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4